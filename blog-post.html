<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- title + description are set per post by script.js (block 7) -->
  <title>Blog post</title>
  <meta name="description" content="A post by Umesh Nayak." />
  <link rel="stylesheet" href="style.css" />
  <script>document.documentElement.dataset.theme = localStorage.getItem("portfolio-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
</head>
<body>
  <!-- ===== Shared top bar ===== -->
  <header class="topbar">
    <div class="meta">
      <svg class="flag" viewBox="0 0 40 24" width="26" height="16" role="img" aria-label="New Zealand">
        <rect width="40" height="24" fill="#00247d" />
        <path d="M0 0 20 12M20 0 0 12" stroke="#fff" stroke-width="3" />
        <path d="M10 0V12M0 6H20" stroke="#fff" stroke-width="4" />
        <path d="M10 0V12M0 6H20" stroke="#cc142b" stroke-width="2" />
        <path d="M0 0 20 12M20 0 0 12" stroke="#cc142b" stroke-width="1" />
        <circle cx="33" cy="6" r="1.7" fill="#cc142b" />
        <circle cx="27" cy="12" r="1.7" fill="#cc142b" />
        <circle cx="35" cy="15" r="1.7" fill="#cc142b" />
        <circle cx="31" cy="19" r="1.7" fill="#cc142b" />
      </svg>
      <span id="clock">--:--</span>
      <span class="dot">·</span>
      <span>Auckland</span>
    </div>

    <a href="index.html" class="name">Umesh Nayak</a>

    <nav class="nav">
      <button class="theme-switch" type="button" aria-label="Switch to dark mode" aria-pressed="false">
        <span class="theme-switch__track"><svg class="theme-switch__sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg><svg class="theme-switch__moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.3A8.5 8.5 0 1 1 9.7 3.5 8.5 8.5 0 0 0 20.5 14.3Z" /></svg><span class="theme-switch__knob"></span></span>
      </button>
      <a class="metal-btn metal-btn--ghost" href="index.html">Home</a>
      <a class="metal-btn metal-btn--ghost" href="projects.html">Projects</a>
    </nav>
  </header>

  <main class="wrap">
    <!-- script.js block 7 fills this from ?slug= against blog.js -->
    <article class="post" id="post-root">
      <p class="post-back"><a href="blogs.html">&larr; Back to Blog</a></p>
      <p>Loading post&hellip;</p>
    </article>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-label="Expanded blog image">
    <button class="lightbox__close" type="button" aria-label="Close image viewer">&times;</button>
    <button class="lightbox__prev" type="button" aria-label="Previous image">&#8592;</button>
    <img src="" alt="" />
    <button class="lightbox__next" type="button" aria-label="Next image">&#8594;</button>
  </div>

  <footer class="foot">
    <span>&copy; <span id="year"></span> Umesh Nayak</span>
  </footer>

  <script src="blog.js"></script>
  <script src="script.js"></script>
</body>
</html>
